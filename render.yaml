services:
  - type: web
    name: ui-real-time-dispatch-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/dispatch.sqlite3
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
